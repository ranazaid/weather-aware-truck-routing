name: Keep the demo awake

# Render's free plan sleeps after 15 idle minutes, and waking up takes about a minute.
# A health check every few minutes keeps the hosted app responsive for reviewers.
# Set the repository variable APP_URL (Settings > Secrets and variables > Actions > Variables).

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    if: vars.APP_URL != ''
    steps:
      - run: curl -fsS --max-time 90 --retry 2 "${{ vars.APP_URL }}/api/health"
